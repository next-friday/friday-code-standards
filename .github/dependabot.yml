version: 2

updates:
  - package-ecosystem: npm
    directory: /
    # pnpm workspace manifests are discovered from the root so Dependabot also updates the root lockfile.
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      eslint-tooling:
        applies-to: version-updates
        patterns:
          - eslint
          - "@eslint/*"
          - eslint-config-prettier
        update-types:
          - minor
          - patch
      repo-tooling:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
          - "@commitlint/*"
          - husky
          - knip
          - lint-staged
          - prettier
          - sort-package-json
          - turbo
          - typescript
        update-types:
          - minor
          - patch
      root-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Bangkok
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
