name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # Needed by paths-filter to inspect pull request changes.
    outputs:
      heavy: ${{ steps.filter.outputs.heavy }}
      ci_policy: ${{ steps.filter.outputs.ci_policy }}
      release_pr: ${{ steps.mode.outputs.release_pr }}
      full_verification: ${{ steps.mode.outputs.full_verification }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/file-filters.yml
      - name: Select verification mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAVY: ${{ steps.filter.outputs.heavy }}
          CI_POLICY: ${{ steps.filter.outputs.ci_policy }}
        run: |
          release_pr=false
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == "changeset-release/main" && "$PR_AUTHOR" == "github-actions[bot]" ]]; then
            release_pr=true
          fi

          full_verification=false
          if [[ "$EVENT_NAME" == "push" || ( "$EVENT_NAME" == "pull_request" && "$release_pr" != "true" && ( "$HEAVY" == "true" || "$CI_POLICY" == "true" ) ) ]]; then
            full_verification=true
          fi

          echo "release_pr=$release_pr" >> "$GITHUB_OUTPUT"
          echo "full_verification=$full_verification" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Check lint
        run: pnpm lint:check

  format:
    name: Format & Manifests
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Check formatting
        run: pnpm format:check
      - name: Check package.json ordering
        run: pnpm sort-package-json:check

  test:
    name: Test & Coverage
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Needed for Codecov OIDC authentication on trusted runs.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Run tests with coverage
        run: pnpm test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          disable_search: true
          fail_ci_if_error: false
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          files: packages/eslint-config-friday/coverage/lcov.info,packages/prettier-config-friday/coverage/lcov.info,packages/commitlint-config-friday/coverage/lcov.info

  check-types:
    name: Type Check
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Check types
        run: pnpm typecheck

  knip:
    name: Knip
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Run Knip
        run: pnpm knip

  audit:
    name: Dependency Audit
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Audit dependencies
        run: pnpm audit

  package-validation:
    name: Package Validation
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Build packages
        run: pnpm build
      - name: Validate peer dependency contracts
        run: pnpm peers:check
      - name: Validate package manifests and files
        run: pnpm check:publint
      - name: Validate package type resolution
        run: pnpm check:attw

  consumer-smoke:
    name: Consumer Smoke
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
        with:
          runtime: node@24.20.0
      - name: Build packages
        run: pnpm build
      - name: Verify packed packages in a clean npm consumer
        shell: bash
        run: | # zizmor: ignore[adhoc-packages] isolated consumer install
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/tarballs"

          for package in eslint-config-friday prettier-config-friday commitlint-config-friday; do
            (
              cd "packages/$package"
              pnpm pack --pack-destination "$consumer_dir/tarballs" >/dev/null
            )
          done

          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --save-exact \
            eslint@10.11.0 \
            prettier@3.9.9 \
            @commitlint/cli@21.2.3 \
            typescript@6.0.3 \
            ./tarballs/*.tgz

          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {ESLint} from "eslint";
          import prettier from "prettier";
          import friday from "@next-friday/eslint-config-friday";
          import prettierConfig from "@next-friday/prettier-config-friday";
          import commitlintConfig from "@next-friday/commitlint-config-friday";

          const eslint = new ESLint({
            overrideConfigFile: true,
            overrideConfig: friday(),
          });
          const [lintResult] = await eslint.lintText("", {filePath: "fixture.js"});
          assert(lintResult);

          const formatted = await prettier.format("const value={a:1}\n", {
            ...prettierConfig,
            parser: "babel",
          });
          assert(formatted.length > 0);

          const shellFormatted = await prettier.format(
            '#!/usr/bin/env sh\nif [ "$value" = "1" ]; then\n\techo yes\nfi\n',
            {
              ...prettierConfig,
              parser: "sh",
            },
          );
          assert(shellFormatted.includes("  echo yes"));

          assert.equal(typeof commitlintConfig, "object");
          NODE

          printf '%s\n' 'chore(test): validate consumer' | \
            npx --no-install commitlint \
              --config node_modules/@next-friday/commitlint-config-friday/dist/index.mjs

  compatibility:
    name: Compatibility (${{ matrix.os }}, Node ${{ matrix.node }}, ESLint ${{ matrix.eslint }})
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.15.0
            eslint: 10.4.0
          - os: ubuntu-latest
            node: 24.21.0
            eslint: 10.11.0
          - os: windows-latest
            node: 24.21.0
            eslint: 10.11.0
          - os: macos-latest
            node: 24.21.0
            eslint: 10.11.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
        with:
          runtime: node@${{ matrix.node }}
      - name: Install matrix ESLint
        shell: bash
        env:
          ESLINT_VERSION: ${{ matrix.eslint }}
        run: >- # zizmor: ignore[adhoc-packages] compatibility matrix
          pnpm --filter @next-friday/eslint-config-friday
          add --save-dev --save-exact
          "eslint@$ESLINT_VERSION"
          --lockfile=false
          --ignore-scripts
      - name: Run package tests
        run: >-
          pnpm --config.verify-deps-before-run=false
          --filter @next-friday/eslint-config-friday
          test

  peer-compatibility:
    name: Peer Compatibility (${{ matrix.package }}, ${{ matrix.peer }} ${{ matrix.version }})
    needs: changes
    if: needs.changes.outputs.full_verification == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: eslint-config-friday
            peer: eslint
            version: 10.4.0
          - package: prettier-config-friday
            peer: prettier
            version: 3.6.0
          - package: commitlint-config-friday
            peer: commitlint
            version: 19.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
        with:
          runtime: node@24.15.0
      - name: Build package
        env:
          PACKAGE_DIR: ./packages/${{ matrix.package }}
        run: pnpm --filter "$PACKAGE_DIR" build
      - name: Verify lower-bound peer compatibility
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PEER_NAME: ${{ matrix.peer }}
          PEER_VERSION: ${{ matrix.version }}
        run: | # zizmor: ignore[adhoc-packages] isolated peer consumer install
          consumer_dir="$(mktemp -d)"
          mkdir -p "$consumer_dir/tarballs"

          (
            cd "packages/$PACKAGE_NAME"
            pnpm pack --pack-destination "$consumer_dir/tarballs" >/dev/null
          )

          cd "$consumer_dir"
          npm init --yes >/dev/null

          case "$PEER_NAME" in
            eslint)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                "eslint@$PEER_VERSION" \
                typescript@6.0.3 \
                ./tarballs/*.tgz

              node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import {ESLint} from "eslint";
          import friday from "@next-friday/eslint-config-friday";

          const eslint = new ESLint({
            overrideConfigFile: true,
            overrideConfig: friday(),
          });
          const [result] = await eslint.lintText("", {filePath: "fixture.js"});
          assert(result);
          NODE
              ;;
            prettier)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                "prettier@$PEER_VERSION" \
                ./tarballs/*.tgz

              node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import prettier from "prettier";
          import config from "@next-friday/prettier-config-friday";

          const formatted = await prettier.format(
            '#!/usr/bin/env sh\nif [ "$value" = "1" ]; then\n\techo yes\nfi\n',
            {
              ...config,
              parser: "sh",
            },
          );
          assert(formatted.includes("  echo yes"));
          NODE
              ;;
            commitlint)
              npm install --ignore-scripts --no-audit --no-fund --save-exact \
                "@commitlint/cli@$PEER_VERSION" \
                ./tarballs/*.tgz

              printf '%s\n' 'chore(test): validate consumer' | \
                npx --no-install commitlint \
                  --config node_modules/@next-friday/commitlint-config-friday/dist/index.mjs
              ;;
          esac

  release-integrity:
    name: Release Integrity
    needs: changes
    if: needs.changes.outputs.release_pr == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: $/.github/actions/setup-pnpm
      - name: Validate release metadata
        run: |
          pnpm format:check
          pnpm sort-package-json:check
      - name: Build packages
        run: pnpm build
      - name: Validate peer dependency contracts
        run: pnpm peers:check
      - name: Validate package manifests and files
        run: pnpm check:publint
      - name: Validate package type resolution
        run: pnpm check:attw

  ci:
    name: All Checks
    if: always()
    timeout-minutes: 5
    needs:
      - changes
      - release-integrity
      - lint
      - format
      - test
      - check-types
      - package-validation
      - consumer-smoke
      - compatibility
      - knip
      - audit
      - peer-compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Require all verification jobs
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
